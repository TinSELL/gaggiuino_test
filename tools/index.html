<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaggiuino 配置清除工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #c9302c; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #terminal {
            width: 100%;
            height: 300px;
            margin-top: 20px;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            padding: 10px;
            border-radius: 4px;
            border: none;
            resize: vertical;
            box-sizing: border-box;
        }
        .alert {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>清除Gaggiuino设备配置 </h2>
    <div class="alert">
        <strong>注意：</strong> 本操作将清除设备上保存的所有用户数据（如 WiFi 密码、用户配置等）。<br>
        请仅使用基于 Chromium 的浏览器（如 Chrome 或 Edge）。
    </div>
    
    <button id="eraseBtn">连接设备并清除数据</button>
    <textarea id="terminal" readonly placeholder="等待操作..."></textarea>
</div>
